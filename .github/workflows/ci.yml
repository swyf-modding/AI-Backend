name: ci

# Runs the shared library's behaviour tests.
#
# That is the whole of it, and the limit is deliberate. This mod compiles against the game's own
# assemblies, so a hosted runner cannot build it: there is no Steam, and the game is not ours to
# redistribute. A hosted runner therefore has nothing to offer beyond the tests, which use nothing but
# the BCL and catch logic a compile cannot - so those run here, and the compile happens on the machine
# that has the game.
#
# The alternative was a second, self-hosted job for the real build. There is not one, and that is on
# purpose: a self-hosted job with no runner registered does not fail, it queues and sits until GitHub
# cancels it 24 hours later. Every push to main left a stuck job and a red build, and the "Run workflow"
# button was a trap that did the same thing on demand.
#
# So the compile, the API surface check and the release are all manual, and documented in RELEASING.md.
# The check that matters before a release - build.ps1 -Test, which runs the API surface check - is one
# command and runs against your own install, where the game is present.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  library-tests:
    name: Library behaviour tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Run the ConfigWatcher tests
        working-directory: vendor/ScamWYF.Modding.Core
        run: |
          cp src/config/ConfigWatcher.cs tests/watcher/ConfigWatcher.cs
          dotnet run --project tests/watcher/WatcherTests.csproj

      - name: Run the window geometry tests
        working-directory: vendor/ScamWYF.Modding.Core
        run: |
          cp src/ui/WindowGeometry.cs tests/window/WindowGeometry.cs
          dotnet run --project tests/window/WindowGeometryTests.csproj